[project]
dependencies = [
    "beautifulsoup4",
    "celery[redis]",
    "django~=5.2.0",
    "django-celery-beat",
    "django-debug-toolbar",
    "django-environ",
    "django-extensions",
    "django-fernet-encrypted-fields",
    "django-filter==25.1",
    "django-handyhelpers",
    "flower",
    "Pillow>=12.3.0",
    "psycopg2-binary",
    "requests>=2.33.0",
    "playwright",
    "whitenoise",
    # Security floors for transitive runtime dependencies; see docs/maintenance/DEPENDENCY_SECURITY.md.
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "djangorestframework>=3.17.2",
    "idna>=3.15",
    "setuptools>=83.0.0",
    "soupsieve>=2.9.0",
    "sqlparse>=0.6.0",
    "tornado>=6.5.9",
    "urllib3>=2.8.0",
    ]
description = "Inland Northwest Tech Community"
dynamic = ["version"]
keywords = ["django"]
license = {file = "LICENSE"}
name = "SpokaneTech"
readme = "README.md"
requires-python = ">=3.10"


[project.scripts]
spokanetech-manage = "manage:main"


[project.optional-dependencies]
dev = [
    "bandit",
    "fawltydeps",
    "model-bakery",
    "mypy",
    "ruff",
    "pip-audit",
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-django",
    "radon",
    "types-requests",
    # Security floor for pytest/Bandit's terminal highlighting dependency.
    "pygments>=2.20.0",
    ]
docker = [
    "gunicorn",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.bandit]
exclude_dirs = [
    "venv", 
    "src/local_test", 
    "src/django_project/tests", 
    "src/django_project/*/management/commands",
    "src/django_project/*/scripts/*"
    ]


[tool.coverage.report]
show_missing = true
omit = [
    "src/local_test/*",
    "src/django_project/manage.py", 
    "src/django_project/core/asgi.py",
    "src/django_project/core/wsgi.py", 
    "src/django_project/*/migrations/*",
    "src/django_project/*/scripts/*",
    "src/django_project/tests/*", 
    ]


[tool.coverage.run]
branch = true
source = ["src/django_project"]


[tool.mypy]
exclude = [
    "venv/*", 
    "src/local_test",
    "src/django_project/.*/migrations/.*",
    "src/django_project/.*/scripts/.*",
    ]
ignore_missing_imports = true


[tool.pytest.ini_options]
addopts = "-s -v -x --strict-markers -m 'not extra'"
testpaths = ["src/django_project"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    ]


[tool.ruff]
line-length = 120
exclude = [
    "src/django_project/manage.py", 
    "src/django_project/tests", 
    "src/django_project/*/migrations", 
    "src/django_project/*/scripts", 
    "src/local_test"
    ]


[tool.fawltydeps]
code = ["src/django_project"]
deps = ["pyproject.toml"]
ignore_unused = [
    "bandit",
    "django-celery-beat",
    "django-debug-toolbar",
    "django-extensions",
    "django-filter",
    "gunicorn",
    "fawltydeps",
    "flower",
    "model-bakery",
    "mypy",
    "ruff",
    "Pillow",
    "pip-audit",
    "psycopg2-binary",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "radon",
    "types-requests",
    "whitenoise",
    # Explicit security floors for packages imported by dependencies.
    "certifi",
    "cryptography",
    "djangorestframework",
    "idna",
    "setuptools",
    "soupsieve",
    "sqlparse",
    "tornado",
    "urllib3",
    "pygments",
    ]
output_format = "human_detailed"


[tool.setuptools]
package-dir = {"" = "src/django_project"}
py-modules = ["manage"]


[tool.setuptools.packages.find]
where = ["src/django_project"]
include = ["core", "core.*", "web", "web.*", "blogs", "blogs.*"]
exclude = []
namespaces = false


[tool.setuptools.package-data]
core = ["templates/**/*.htm", "templates/**/*.html", "static/**/*"]
web = ["templates/**/*.htm", "templates/**/*.html"]
blogs = ["templates/**/*.htm", "templates/**/*.html"]
