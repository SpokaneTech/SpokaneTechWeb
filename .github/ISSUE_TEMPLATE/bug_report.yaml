name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, tokens, webhook URLs, or private personal data.
        Report suspected vulnerabilities privately using our [security policy](https://github.com/SpokaneTech/SpokaneTechWeb/blob/main/.github/SECURITY.md).
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is. Include any applicable screenshots or files.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the browser and OS for website issues. For local/deployment issues, include Python/Django versions, the commit or release, and whether you use runserver or Docker. Do not paste environment files or secrets.
      placeholder: "Example: Firefox on Windows; or Python 3.13, Django 5.2, Docker, commit abc123"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant logs after removing secrets, credentials, webhook URLs, and personal information. Backticks are not needed.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/SpokaneTech/SpokaneTechWeb/blob/main/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
